  <header class="hero hero-small" style="background-image: url('images/home.jpg');">

    <div class="hero-text">

    </div>

  <main class="game-page">
    <section class="game-instructions">
      <h2>How to Play</h2>
      <ul>
        <li>Press the <strong>SPACE BAR</strong> (or tap/click the game) to make Nacho jump.</li>
        <li>Dodge the cars zooming in from the right &mdash; don't get hit!</li>
        <li>The longer you survive, the faster it gets.</li>
        <li>Try to beat your high score!</li>
      </ul>
    </section>

    <section class="game-wrap">
      <canvas id="gameCanvas" width="700" height="260"></canvas>
    </section>
  </main>
